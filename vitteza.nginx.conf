# VITTEZA — nginx vhost for Laravel + Filament app.
# HTTP-only for now; certbot --nginx will add the SSL server block once DNS resolves.
server {
    listen 80;
    listen [::]:80;
    server_name vitteza.ru www.vitteza.ru app.vitteza.ru;

    root /var/www/vitteza/public;
    index index.php index.html;

    client_max_body_size 16m;
    charset utf-8;

    access_log /var/log/nginx/vitteza_access.log;
    error_log  /var/log/nginx/vitteza_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|ico|svg|woff2?|ttf|eot)$ {
        expires 30d; access_log off; add_header Cache-Control "public";
    }
}
