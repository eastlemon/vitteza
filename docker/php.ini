; VITTEZA — PHP-настройки для контейнера (Лaravel + Filament)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

; Часовой пояс ТЗ: московское время рейсов
date.timezone = Europe/Moscow

; Продакшен-настройки opcache (локальный запуск, но сборка продовая)
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Логи — в stderr контейнера
log_errors = 1
error_log = /dev/stderr
display_errors = 0
